# Roicard Nginx config
# Place at /etc/nginx/sites-available/roicard then:
#   sudo ln -s /etc/nginx/sites-available/roicard /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace DOMAIN with your real domain (e.g. roicard.com).
# Run certbot afterwards to enable HTTPS (see deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # Redirect everything to HTTPS (enabled after certbot).
    # Before SSL is set up, comment out the return line below.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    # ---- SSL (fill in after certbot obtains certs) ----
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # ---- Laravel API: /api/* goes to PHP-FPM ----
    location /api {
        root /var/www/roicard/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-Requested-With' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ---- Laravel served media files ----
    location /storage/ {
        alias /var/www/roicard/storage/app/public/;
        try_files $uri =404;
    }

    # ---- Next.js frontend: everything else proxies to port 3000 ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
